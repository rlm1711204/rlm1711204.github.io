# Builds the Kaasu Android APK on GitHub's servers and publishes it on the
# Releases page, so it can be downloaded from:
#   https://github.com/rlm1711204/rlm1711204.github.io/releases/latest/download/Kaasu.apk
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android-apk.yml']

permissions:
  contents: write   # needed to create the Release with the APK

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KAASU_KEYSTORE_PASSWORD: ${{ secrets.KAASU_KEYSTORE_PASSWORD }}
    steps:
      - name: Check the signing password is set
        run: |
          if [ -z "$KAASU_KEYSTORE_PASSWORD" ]; then
            echo "::warning::Add the repository secret KAASU_KEYSTORE_PASSWORD (Settings > Secrets and variables > Actions). Building a test version only; no release will be published."
            echo "READY=false" >> "$GITHUB_ENV"
          else
            echo "READY=true" >> "$GITHUB_ENV"
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Use the Android SDK that comes with GitHub's build machine
        run: |
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          yes | "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Test build (no signing password yet)
        if: env.READY != 'true'
        run: gradle -p android assembleDebug --no-daemon

      - name: Build signed APK
        if: env.READY == 'true'
        run: |
          VERSION="1.0.${{ github.run_number }}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          gradle -p android assembleRelease -PversionCode=${{ github.run_number }} -PversionName=$VERSION --no-daemon
          cp android/app/build/outputs/apk/release/app-release.apk Kaasu.apk
          ls -la Kaasu.apk

      - uses: actions/upload-artifact@v4
        if: env.READY == 'true'
        with:
          name: Kaasu-apk
          path: Kaasu.apk

      - name: Publish on the Releases page
        if: env.READY == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ env.VERSION }}
          name: Kaasu Android ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: Kaasu.apk
          body: |
            Kaasu for Android. Download **Kaasu.apk** below, open it on your phone and tap **Install**.
            (Android may ask you to allow installing apps from Chrome / Files the first time.)
